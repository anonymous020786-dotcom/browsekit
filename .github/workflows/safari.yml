# Builds the Safari version on macOS: Apple's converter wraps dist/safari in an Xcode app project, then
# xcodebuild compiles it. The result is unsigned; App Store distribution needs signing (see PUBLISHING.md).
# Called by CI and Release; can also be run by hand from the Actions tab.
name: Safari build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: io.github.anonymous020786.browsekit

jobs:
  safari:
    name: Safari (macOS, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build browser packages
        run: node scripts/build.mjs

      - name: Convert to a Safari web extension app project
        run: |
          xcrun safari-web-extension-converter dist/safari \
            --project-location build --app-name Browsekit \
            --bundle-identifier "$APP_ID" \
            --swift --macos-only --copy-resources --no-open --no-prompt --force

      # Xcode requires the extension's bundle ID to start with the app's; set both explicitly
      # instead of relying on the converter's derived names.
      - name: Align bundle identifiers
        run: |
          project=build/Browsekit/Browsekit.xcodeproj/project.pbxproj
          echo "Before:"; grep "PRODUCT_BUNDLE_IDENTIFIER" "$project" | sort -u
          sed -i '' -E "/PRODUCT_BUNDLE_IDENTIFIER = .*[Ee]xtension/ s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = \"$APP_ID.Extension\";/" "$project"
          sed -i '' -E "/PRODUCT_BUNDLE_IDENTIFIER = .*[Ee]xtension/! s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = \"$APP_ID\";/" "$project"
          echo "After:"; grep "PRODUCT_BUNDLE_IDENTIFIER" "$project" | sort -u

      - name: Compile with Xcode (unsigned)
        run: |
          xcodebuild -project build/Browsekit/Browsekit.xcodeproj -list
          xcodebuild -project build/Browsekit/Browsekit.xcodeproj -scheme Browsekit -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Package the app
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/Browsekit.app \
            "dist/browsekit-safari-macos-$version-unsigned.zip"
          ls -la dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browsekit-safari
          path: dist/browsekit-safari-*.zip
          retention-days: 30
