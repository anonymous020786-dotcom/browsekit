name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate feature registry (ids, categories, shortcut conflicts)
        run: npm run check

      - name: Build store packages
        run: npm run build

      - name: Lint Firefox package with addons.mozilla.org rules
        run: npm run lint:firefox

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests against the built Chrome package
        run: npx playwright test
        env:
          BROWSEKIT_EXTENSION: dist/chrome

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload store packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browsekit-packages
          path: dist/*.zip
          retention-days: 30
